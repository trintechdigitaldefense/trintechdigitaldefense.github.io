<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login — TrinTech Portal</title>
<style>
body{font-family:system-ui,sans-serif;background:#030a0e;color:#e8eef2;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0}
form{background:#071a22;border:1px solid rgba(0,229,255,.2);padding:2rem;border-radius:8px;width:min(360px,92vw)}
h1{font-size:1.2rem;margin:0 0 1rem}
label{display:block;font-size:.8rem;color:#7a8a96;margin:.75rem 0 .25rem}
input{width:100%;padding:.65rem;border-radius:4px;border:1px solid rgba(0,229,255,.2);background:#030a0e;color:#e8eef2;box-sizing:border-box}
button{margin-top:1.25rem;width:100%;padding:.75rem;border:0;border-radius:4px;background:#00e5ff;color:#000;font-weight:600;cursor:pointer}
.err{color:#ff5c5c;font-size:.85rem;margin-top:.75rem}
p{font-size:.75rem;color:#7a8a96;margin-top:1rem}
</style></head><body>
<form method="post" action="/login">
  <h1>TrinTech Client Portal</h1>
  <label>Email</label><input type="email" name="email" required autocomplete="username">
  <label>Password</label><input type="password" name="password" required autocomplete="current-password">
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <button type="submit">Sign in</button>
  <p>Authorised clients only. MFA required in production.</p>
</form>
</body></html>
