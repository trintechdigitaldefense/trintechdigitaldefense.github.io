<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✅ Copy Token — TrinTech</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,sans-serif;background:#0a1628;color:#e0e0e0;
            display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px}
        .box{background:#111d33;border:1px solid #22c55e33;border-radius:16px;padding:30px;max-width:480px;width:100%;text-align:center}
        h1{color:#22c55e;font-size:1.3em;margin-bottom:6px}
        .sub{color:#8899aa;font-size:.85em;margin-bottom:16px}
        textarea{width:100%;min-height:100px;background:#0a1628;border:1px solid #334;color:#e0e0e0;border-radius:8px;padding:12px;font-family:monospace;font-size:.7em;resize:vertical}
        .btn-green{background:#22c55e;color:#fff;border:none;padding:12px 24px;border-radius:8px;font-weight:600;font-size:.95em;margin-top:10px;cursor:pointer;width:100%}
        .err{background:#ef444422;border:1px solid #ef4444;color:#ef4444;padding:12px;border-radius:8px;margin-top:10px;font-size:.9em}
    </style>
</head>
<body>
<div class="box">
    <h1>✅ Token Received</h1>
    <p class="sub">Copy everything from the address bar below and send to your agent</p>
    <textarea id="url" readonly></textarea>
    <button class="btn-green" onclick="copy()">📋 Copy Everything</button>
    <div id="info"></div>
</div>
<script>
const hash = window.location.hash;
const params = new URLSearchParams(window.location.search);
const token = params.get('access_token');
const code = params.get('code');

if (token) {
    document.getElementById('url').value =
        'https://developers.facebook.com/tools/explorer/#access_token=' + token;
} else if (code) {
    document.getElementById('info').innerHTML = '<div class="err">Got auth code instead of token.<br>Use the URL from address bar including #access_token=...</div>';
    document.getElementById('url').value = window.location.href;
} else {
    document.getElementById('info').innerHTML = '<div class="err">No token in URL. Make sure you saw a "Continue" screen and completed it.</div>';
}
function copy(){
    document.getElementById('url').select();
    document.execCommand('copy');
    alert('Copied! Send this to your agent.');
}
</script>
</body>
</html>
